services:
  web:
    build: .
    image: exam-answer-checker
    ports:
      - "8000:8000"
    # Values come from .env if present (see .env.example).
    environment:
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
      MAX_FILE_MB: ${MAX_FILE_MB:-50}
      MAX_PAGES: ${MAX_PAGES:-300}
      RENDER_DPI: ${RENDER_DPI:-200}
      OCR_THREADS: ${OCR_THREADS:-}
      JOB_WORKERS: ${JOB_WORKERS:-1}
      MATCH_MIN_SCORE: ${MATCH_MIN_SCORE:-0.35}
      MATCH_MIN_MARGIN: ${MATCH_MIN_MARGIN:-0.08}
      TICK_RATIO: ${TICK_RATIO:-1.6}
      TICK_RUNNER_UP_RATIO: ${TICK_RUNNER_UP_RATIO:-1.3}
      MARKS_CORRECT: ${MARKS_CORRECT:-1.5}
      MARKS_WRONG: ${MARKS_WRONG:-0}
      AI_FALLBACK: ${AI_FALLBACK:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    volumes:
      - exam-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s

  # docker compose run --rm test
  test:
    build:
      context: .
      args:
        DEV: "1"
    image: exam-answer-checker-dev
    profiles: ["test"]
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATA_DIR: /tmp/data
    command: ["python", "-m", "pytest", "-q"]

volumes:
  exam-data:
