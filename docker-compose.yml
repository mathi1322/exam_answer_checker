services:
  web:
    build: .
    image: exam-answer-checker
    # Published on this machine only. The public reaches the app through the caddy service (profile "public").
    ports:
      - "127.0.0.1:8000:8000"
    # Values come from .env if present (see .env.example).
    environment:
      # Trust X-Forwarded-For from the proxy, so rate limits apply per real client. Safe only while port 8000 is
      # not reachable from the internet (see the ports line above).
      FORWARDED_ALLOW_IPS: "*"
      RETENTION_HOURS: ${RETENTION_HOURS:-2}
      MAX_FILE_MB: ${MAX_FILE_MB:-50}
      MAX_PAGES: ${MAX_PAGES:-300}
      MAX_PAGE_INCHES: ${MAX_PAGE_INCHES:-20}
      UPLOADS_PER_HOUR: ${UPLOADS_PER_HOUR:-10}
      MAX_PENDING_JOBS: ${MAX_PENDING_JOBS:-10}
      MAX_DISK_GB: ${MAX_DISK_GB:-5}
      RENDER_DPI: ${RENDER_DPI:-200}
      OCR_THREADS: ${OCR_THREADS:-}
      JOB_WORKERS: ${JOB_WORKERS:-1}
      MATCH_MIN_SCORE: ${MATCH_MIN_SCORE:-0.35}
      MATCH_MIN_MARGIN: ${MATCH_MIN_MARGIN:-0.08}
      TICK_RATIO: ${TICK_RATIO:-1.6}
      TICK_RUNNER_UP_RATIO: ${TICK_RUNNER_UP_RATIO:-1.3}
      MARKS_CORRECT: ${MARKS_CORRECT:-1.5}
      MARKS_WRONG: ${MARKS_WRONG:-0}
      AI_FALLBACK: ${AI_FALLBACK:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    volumes:
      - exam-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s

  # HTTPS on your domain: DOMAIN=checker.example.com docker compose --profile public up -d
  caddy:
    image: caddy:2.10-alpine
    profiles: ["public"]
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      MAX_REQUEST_MB: ${MAX_REQUEST_MB:-101}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  # docker compose run --rm test
  test:
    build:
      context: .
      args:
        DEV: "1"
    image: exam-answer-checker-dev
    profiles: ["test"]
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATA_DIR: /tmp/data
    command: ["python", "-m", "pytest", "-q"]

volumes:
  exam-data:
  caddy-data:
  caddy-config:
